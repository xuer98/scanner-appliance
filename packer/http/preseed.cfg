#### Scanner appliance - Debian 12 (bookworm) preseed
# Served to debian-installer by Packer's HTTP server (see base.pkr.hcl).
# Produces a minimal LVM system with a separate /var, no root password, and a
# temporary "packer" build user which packer/scripts/cleanup.sh deletes.

### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string appliance
d-i netcfg/get_domain string localdomain
d-i netcfg/hostname string appliance
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm

### Accounts
# Root stays locked (no password). The installer then grants the created user
# sudo; late_command below makes it passwordless. cleanup.sh removes the user.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Packer build user
d-i passwd/username string packer
d-i passwd/user-password password packer
d-i passwd/user-password-again password packer
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false

### Partitioning: LVM with a separate /var (spool + logs live there)
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string appliance
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select appliance
d-i partman-auto/expert_recipe string \
  appliance :: \
    512 512 512 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    8192 10000 16384 ext4 \
      $lvmok{ } lv_name{ root } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    2048 2048 2048 linux-swap \
      $lvmok{ } lv_name{ swap } \
      method{ swap } format{ } \
    . \
    8192 20000 -1 ext4 \
      $lvmok{ } lv_name{ var } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /var } \
    .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid
d-i partman-basicfilesystems/no_mount_point boolean false

### Base system
d-i base-installer/kernel/image string linux-image-amd64
d-i base-installer/install-recommends boolean false

### Apt
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

### Packages (PLAN 4.2 plus build-time tooling)
# openssh-server and sudo are only for the Packer provisioners; cleanup.sh
# purges openssh-server. chrony is intentionally absent: PLAN 4.2 lists it but
# harden.sh purges it in favour of htpdate, so it is never installed here.
# redis-server backs the openvas VT cache (install-openvas.sh configures a
# socket-only instance and masks the stock TCP one). The openvas build deps
# are installed by install-openvas.sh and purged by cleanup.sh.
tasksel tasksel/first multiselect
d-i pkgsel/include string \
  open-vm-tools nftables systemd-resolved ca-certificates htpdate redis-server \
  util-linux sudo openssh-server curl gnupg \
  unattended-upgrades lvm2 iproute2
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

### Finish
# late_command (runs in the installer environment, target at /target):
#  - serial console on ttyS0 alongside tty1 so the CI smoke test can drive the
#    console over QEMU's serial port;
#  - passwordless sudo for the temporary packer user.
d-i preseed/late_command string \
  in-target sh -c 'echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-packer && chmod 0440 /etc/sudoers.d/90-packer'; \
  in-target sed -i 's/^GRUB_CMDLINE_LINUX=.*/GRUB_CMDLINE_LINUX="console=tty1 console=ttyS0,115200"/' /etc/default/grub; \
  in-target sh -c 'printf "GRUB_TERMINAL=\"console serial\"\nGRUB_SERIAL_COMMAND=\"serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1\"\n" >> /etc/default/grub'; \
  in-target update-grub
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
